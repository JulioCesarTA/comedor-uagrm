server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: cualquier ruta no-existente devuelve index.html
    # (así /portal, /bi, /backoffice, /callback de Keycloak funcionan)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CORS para assets del remoteEntry (Module Federation)
    location ~ \.(js|css|map|json)$ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
}

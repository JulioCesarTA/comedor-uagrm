# Despliegue en 3 EC2 de la misma VPC (us-west-2). Cada máquina levanta solo sus servicios:
#   datos   : mongo, postgres x3, dynamodb-local, localstack, keycloak
#   negocio : menu, comensales, pagos, ia-ml, graphql, api-gateway, n8n
#   web     : frontends (shell, backoffice, portal, bi) + nginx del servidor con HTTPS (único público)
# Imágenes: se construyen en el PC (`build` + `push` a ECR) y las EC2 solo hacen `pull`.
# Variables (.env.ec2): HOST=<ip-con-guiones>.sslip.io  ECR=<cuenta>.dkr.ecr.<región>.amazonaws.com/comedor  IP_DATOS=<ip privada de datos>  IP_NEGOCIO=<ip privada de negocio>
x-aws-datos: &aws-datos
  AWS_ENDPOINT_URL: http://${IP_DATOS}:4566

services:
  # ---------- máquina "datos": publican sus puertos en la red privada (el grupo de seguridad solo deja entrar a la VPC) ----------
  keycloak:
    environment:
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    volumes: !override
      - ./deploy/ec2/realm:/opt/keycloak/data/import:ro

  # ---------- máquina "negocio" ----------
  menu-inventario-service:
    image: ${ECR}/menu-inventario-service:v1
    ports: !reset []
    depends_on: !reset []
    environment:
      <<: *aws-datos
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@${IP_DATOS}:27017/${MONGO_DB_MENU}?authSource=admin
  comensales-reservas-service:
    image: ${ECR}/comensales-reservas-service:v1
    ports: !reset []
    depends_on: !reset []
    environment:
      <<: *aws-datos
      DATABASE_URL: postgres://${POSTGRES_COMENSALES_USER}:${POSTGRES_COMENSALES_PASSWORD}@${IP_DATOS}:5433/${POSTGRES_COMENSALES_DB}
  pagos-tickets-service:
    image: ${ECR}/pagos-tickets-service:v1
    ports: !reset []
    depends_on: !reset []
    environment:
      <<: *aws-datos
      DB_HOST: ${IP_DATOS}
      DB_PORT: "5434"
  ia-ml-service:
    image: ${ECR}/ia-ml-service:v1
    ports: !reset []
    depends_on: !reset []
    environment:
      <<: *aws-datos
      CQRS_DATABASE_URL: postgresql://${POSTGRES_CQRS_USER}:${POSTGRES_CQRS_PASSWORD}@${IP_DATOS}:5435/${POSTGRES_CQRS_DB}
      DYNAMODB_ENDPOINT: http://${IP_DATOS}:8000
      KEYCLOAK_URL: http://${IP_DATOS}:8085
  graphql-gateway:
    image: ${ECR}/graphql-gateway:v1
    ports: !reset []
    depends_on: !reset []
  api-gateway:
    image: ${ECR}/api-gateway:v1
    depends_on: !reset []
    environment:
      KEYCLOAK_URL: http://${IP_DATOS}:8085
  n8n:
    entrypoint: ["sh", "-c", "for f in /flows/*.json; do n8n import:workflow --input=$$f; done; n8n update:workflow --id=telegramComedor01 --active=true; exec n8n start"]

  # ---------- máquina "web" ----------
  shell:
    image: ${ECR}/shell:v1
    ports: !override ["127.0.0.1:13000:80"]
    build:
      args:
        VITE_KEYCLOAK_URL: https://${HOST}:8085
        VITE_API_URL: https://${HOST}:8080
        VITE_REMOTE_PORTAL: https://${HOST}:3002/assets/remoteEntry.js
        VITE_BACKOFFICE_URL: https://${HOST}:3001?embedded=1
        VITE_BI_URL: https://${HOST}:3003?embedded=1
  backoffice-gestion:
    image: ${ECR}/backoffice-gestion:v1
    ports: !override ["127.0.0.1:13001:80"]
  portal-estudiante:
    image: ${ECR}/portal-estudiante:v1
    ports: !override ["127.0.0.1:13002:80"]
    build:
      args:
        VITE_KEYCLOAK_URL: https://${HOST}:8085
        VITE_API_URL: https://${HOST}:8080
  inteligencia-negocio:
    image: ${ECR}/inteligencia-negocio:v1
    ports: !override ["127.0.0.1:13003:3003"]
    environment:
      API_INTERNAL_URL: http://${IP_NEGOCIO}:8080
    build:
      args:
        NEXT_PUBLIC_KEYCLOAK_URL: https://${HOST}:8085
        NEXT_PUBLIC_API_URL: https://${HOST}:8080

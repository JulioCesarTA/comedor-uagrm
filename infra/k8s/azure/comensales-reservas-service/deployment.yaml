apiVersion: apps/v1
kind: Deployment
metadata: { name: comensales-reservas-service, namespace: comedor, labels: { app: comensales-reservas-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: comensales-reservas-service } }
  template:
    metadata: { labels: { app: comensales-reservas-service, azure.workload.identity/use: "true" } }
    spec:
      serviceAccountName: comensales-sa
      containers:
        - name: app
          image: ${ACR_REGISTRY}.azurecr.io/comensales-reservas-service:${IMAGE_TAG}
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: comensales-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: comensales-secrets, key: database-url } }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 30 }
          volumeMounts:
            - name: akv-csi
              mountPath: "/mnt/secrets"
              readOnly: true
      volumes:
        - name: akv-csi
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: "comensales-akv" }
---
apiVersion: v1
kind: Service
metadata: { name: comensales-reservas-service, namespace: comedor }
spec:
  selector: { app: comensales-reservas-service }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: comensales-config, namespace: comedor }
data:
  NODE_ENV: "production"
  PORT: "8080"
  AWS_REGION: "us-east-1"
  AWS_ENDPOINT_URL: "https://api.comedor.uagrm.cloud"   # cross-cloud → DynamoDB en AWS
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: comensales-sa
  namespace: comedor
  annotations:
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: comensales-hpa, namespace: comedor }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: comensales-reservas-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: comensales-ing
  namespace: comedor
  annotations: { kubernetes.io/ingress.class: "azure/application-gateway" }
spec:
  rules:
    - host: comensales.comedor.uagrm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: comensales-reservas-service, port: { number: 80 } } }

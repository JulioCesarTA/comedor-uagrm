apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: comedor, labels: { app: api-gateway } }
spec:
  replicas: 3
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: app
          image: ${ECR_REGISTRY}/api-gateway:${IMAGE_TAG}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: KEYCLOAK_URL, value: "https://auth.comedor.uagrm.cloud" }
            - { name: KEYCLOAK_REALM, value: "comedor-uagrm" }
            - { name: MENU_URL, value: "http://menu-inventario-service.comedor.svc.cluster.local" }
            - { name: COMENSALES_URL, value: "https://comensales.azure-cross-cloud.net" }
            - { name: PAGOS_URL, value: "https://pagos.gcp-cross-cloud.net" }
            - { name: IA_URL, value: "http://ia-ml-service.comedor.svc.cluster.local" }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway, namespace: comedor }
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ing
  namespace: comedor
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - host: api.comedor.uagrm.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { number: 80 } } }

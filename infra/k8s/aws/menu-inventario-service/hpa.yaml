apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: menu-inventario-hpa, namespace: comedor }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: menu-inventario-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu,    target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:25.0
        imagePullPolicy: Always
        command: ["/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
        ports:
        - containerPort: 8080
        env:
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          valueFrom: { secretKeyRef: { name: comedor, key: url-keycloak-jdbc } }
        - name: KC_DB_USERNAME
          value: "postgres"
        - name: KC_DB_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: rds-password } }
        - name: KEYCLOAK_ADMIN
          valueFrom: { secretKeyRef: { name: comedor, key: kc-admin } }
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: kc-admin-password } }
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_PROXY_HEADERS
          value: "xforwarded"
        resources:
          requests: { memory: 700Mi, cpu: 50m }
          limits: { memory: 1500Mi }
        volumeMounts:
        - { name: realm, mountPath: /opt/keycloak/data/import }
      volumes:
      - name: realm
        configMap: { name: realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: comedor
spec:
  selector: { app: keycloak }
  ports:
  - port: 8080
    targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: n8n }
  template:
    metadata:
      labels: { app: n8n }
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        imagePullPolicy: Always
        command: ["sh", "-c", "for f in /flows/*.json; do n8n import:workflow --input=$f; done; n8n update:workflow --id=telegramComedor01 --active=true; exec n8n start"]
        ports:
        - containerPort: 5678
        env:
        - name: N8N_BASIC_AUTH_ACTIVE
          value: "true"
        - name: N8N_BASIC_AUTH_USER
          valueFrom: { secretKeyRef: { name: comedor, key: n8n-user } }
        - name: N8N_BASIC_AUTH_PASSWORD
          valueFrom: { secretKeyRef: { name: comedor, key: n8n-password } }
        - name: N8N_PORT
          value: "5678"
        - name: GENERIC_TIMEZONE
          value: "America/La_Paz"
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: "false"
        - name: TELEGRAM_BOT_TOKEN
          valueFrom: { secretKeyRef: { name: comedor, key: telegram } }
        resources:
          requests: { memory: 400Mi, cpu: 50m }
          limits: { memory: 1Gi }
        volumeMounts:
        - { name: flujos, mountPath: /flows }
      volumes:
      - name: flujos
        configMap: { name: flujos-n8n }
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: comedor
spec:
  selector: { app: n8n }
  ports:
  - port: 5678
    targetPort: 5678

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: entrada-conf
  namespace: comedor
data:
  nginx.conf: |
    events {}
    http {
      map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
      listen 3000;
      location / {
        proxy_pass http://shell:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
      }
    }
    server {
      listen 3001;
      location / {
        proxy_pass http://backoffice-gestion:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
      }
    }
    server {
      listen 3002;
      location / {
        proxy_pass http://portal-estudiante:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
      }
    }
    server {
      listen 3003;
      location / {
        proxy_pass http://bi:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
      }
    }
    server {
      listen 8080;
      location / {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
      }
    }
    server {
      listen 8085;
      location / {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
      }
    }
    server {
      listen 5678;
      location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
      }
    }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entrada
  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: entrada }
  template:
    metadata:
      labels: { app: entrada }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: { entrada: "si" }
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 3000
        - containerPort: 3001
        - containerPort: 3002
        - containerPort: 3003
        - containerPort: 8080
        - containerPort: 8085
        - containerPort: 5678
        volumeMounts:
        - { name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }
        resources:
          requests: { memory: 32Mi, cpu: 20m }
      volumes:
      - name: conf
        configMap: { name: entrada-conf }


apiVersion: v1
kind: Namespace
metadata:
  name: comedor

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-inventario-service
  namespace: comedor
spec:
  replicas: 1
  selector:
    matchLabels: { app: menu-inventario-service }
  template:
    metadata:
      labels: { app: menu-inventario-service }
    spec:
      containers:
      - name: menu-inventario-service
        image: 483549541027.dkr.ecr.us-west-2.amazonaws.com/comedor/menu-inventario:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_DATA_MONGODB_URI
          valueFrom: { secretKeyRef: { name: comedor, key: mongo-uri } }
        - name: aws_sns_topicDominioMenuArn
          value: "arn:aws:sns:us-west-2:483549541027:dominio-menu"
        - name: AWS_REGION
          value: "us-west-2"
        - name: AWS_ACCOUNT_ID
          value: "483549541027"
        - name: AWS_ACCESS_KEY_ID
          valueFrom: { secretKeyRef: { name: aws-app, key: id } }
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom: { secretKeyRef: { name: aws-app, key: secret } }
        readinessProbe:
          httpGet: { path: /actuator/health, port: 8080 }
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 12
        resources:
          requests: { memory: 512Mi, cpu: 50m }
          limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: menu-inventario-service
  namespace: comedor
spec:
  selector: { app: menu-inventario-service }
  ports:
  - port: 8080
    targetPort: 8080


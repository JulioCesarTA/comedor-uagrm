# ================================================================
# Comedor UAGRM — docker-compose para EC2 en AWS.
# Usa servicios gestionados reales: DocumentDB, RDS, DynamoDB, SNS/SQS, S3.
# Las imágenes se bajan desde ECR (ya pushadas).
# ================================================================
services:

  # ---------------- Auth / automatización ----------------
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: comedor-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
    ports: ["8085:8080"]
    volumes:
      - ./auth/keycloak:/opt/keycloak/data/import:ro
    networks: [comedor-net]

  n8n:
    image: n8nio/n8n:latest
    container_name: comedor-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123
      WEBHOOK_URL: http://${PUBIP}:5678/
      GENERIC_TIMEZONE: America/La_Paz
    ports: ["5678:5678"]
    volumes:
      - n8n-data:/home/node/.n8n
      - ./automation/n8n/flows:/flows:ro
    networks: [comedor-net]

  # ---------------- Microservicios (desde ECR) ----------------
  menu-inventario-service:
    image: 948218213765.dkr.ecr.us-west-2.amazonaws.com/menu-inventario-service:v1
    container_name: comedor-menu-inventario
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: aws
      SPRING_DATA_MONGODB_URI: ${DOCDB_URI}
      AWS_REGION: us-west-2
      AWS_ENDPOINT_URL: ""   # vacío = AWS real
      aws_sns_topicDominioMenuArn: arn:aws:sns:us-west-2:948218213765:dominio-menu
    ports: ["8081:8080"]
    networks: [comedor-net]

  comensales-reservas-service:
    image: 948218213765.dkr.ecr.us-west-2.amazonaws.com/comensales-reservas-service:v1
    container_name: comedor-comensales-reservas
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://postgres:ComedorDemo2026%21@${RDS_HOST}:5432/comensales_reservas
      AWS_REGION: us-west-2
      AWS_ENDPOINT_URL: ""
    ports: ["8082:8080"]
    networks: [comedor-net]

  pagos-tickets-service:
    image: 948218213765.dkr.ecr.us-west-2.amazonaws.com/pagos-tickets-service:v1
    container_name: comedor-pagos-tickets
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: base64:ZGV2ZWxvcG1lbnRfa2V5X2NoYW5nZV9pbl9wcm9kdWN0aW9uX3Bscw==
      DB_CONNECTION: pgsql
      DB_HOST: ${RDS_HOST}
      DB_PORT: 5432
      DB_DATABASE: pagos_tickets
      DB_USERNAME: postgres
      DB_PASSWORD: ComedorDemo2026!
      AWS_REGION: us-west-2
      AWS_ENDPOINT_URL: ""
    ports: ["8083:8080"]
    networks: [comedor-net]

  ia-ml-service:
    image: 948218213765.dkr.ecr.us-west-2.amazonaws.com/ia-ml-service:v1
    container_name: comedor-ia-ml
    restart: unless-stopped
    environment:
      APP_ENV: production
      CQRS_DATABASE_URL: postgresql://postgres:ComedorDemo2026%21@${RDS_HOST}:5432/cqrs_read
      AWS_REGION: us-west-2
      AWS_ENDPOINT_URL: ""
      DYNAMODB_ENDPOINT: ""
      MENU_URL: http://menu-inventario-service:8080
      COMENSALES_URL: http://comensales-reservas-service:8080
      PAGOS_URL: http://pagos-tickets-service:8080
    ports: ["8084:8080"]
    networks: [comedor-net]

  # ---------------- Gateways ----------------
  api-gateway:
    image: 948218213765.dkr.ecr.us-west-2.amazonaws.com/api-gateway:v1
    container_name: comedor-api-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      AUTH_DISABLED: "true"
      MENU_URL: http://menu-inventario-service:8080
      COMENSALES_URL: http://comensales-reservas-service:8080
      PAGOS_URL: http://pagos-tickets-service:8080
      IA_URL: http://ia-ml-service:8080
    ports: ["8080:8080"]
    networks: [comedor-net]

networks:
  comedor-net:
    driver: bridge

volumes:
  n8n-data:

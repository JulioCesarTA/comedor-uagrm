name: ci-comensales-reservas
on:
  push:
    paths: ['services/comensales-reservas-service/**', '.github/workflows/ci-comensales-reservas.yml']
  pull_request:
    paths: ['services/comensales-reservas-service/**']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/comensales-reservas-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: services/comensales-reservas-service/package.json }
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: docker build -t comensales-reservas-service:${{ github.sha }} .

name: cd-gcp
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['services/pagos-tickets-service/**', 'infra/k8s/gcp/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with: { workload_identity_provider: ${{ secrets.GCP_WIP }}, service_account: ${{ secrets.GCP_SA }} }
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker auth for GAR
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build & push
        run: |
          IMG=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/comedor-uagrm/pagos-tickets-service:${{ github.sha }}
          docker build -t $IMG services/pagos-tickets-service
          docker push $IMG
      - name: GKE credentials
        run: gcloud container clusters get-credentials gke-comedor --region ${{ secrets.GCP_REGION }}
      - name: kubectl apply
        run: |
          export GAR_REGISTRY=${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/comedor-uagrm
          export IMAGE_TAG=${{ github.sha }}
          export GCP_PROJECT=${{ secrets.GCP_PROJECT }}
          export CLOUD_SQL_REGION=${{ secrets.GCP_REGION }}
          export CLOUD_SQL_INSTANCE=pagos-pg
          envsubst < infra/k8s/gcp/pagos-tickets-service/deployment.yaml | kubectl apply -f -

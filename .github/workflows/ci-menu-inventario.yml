name: ci-menu-inventario
on:
  push:
    branches: [main]
    paths: ['services/menu-inventario-service/**', '.github/workflows/ci-menu-inventario.yml']
  pull_request:
    paths: ['services/menu-inventario-service/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/menu-inventario-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -q verify
      - name: Build Docker image
        run: docker build -t menu-inventario-service:${{ github.sha }} .
